services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nins-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      MONGO_URI: ${MONGO_URI}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-100}
      DB_MIN_POOL_SIZE: ${DB_MIN_POOL_SIZE:-20}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      - redis

  redis:
    image: redis:8-alpine
    container_name: nins-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  redis_data:
